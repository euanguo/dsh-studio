<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1340" viewBox="0 0 1720 1340" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a94a6"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <style>
      .col-title { font-size:17px; font-weight:700; }
      .col-sub { font-size:12.5px; fill:#667; }
      .box-title { font-size:13.5px; font-weight:700; }
      .box-line { font-size:12.5px; fill:#333; }
      .box-line2 { font-size:12px; fill:#555; }
      .mono { font-family:ui-monospace, Menlo, Consolas, monospace; }
      .up { fill:#f4f7ff; stroke:#4d6bfe; stroke-width:1.3; }
      .our { fill:#f1faf5; stroke:#2f9e63; stroke-width:1.3; }
      .hl { fill:#fff8e8; stroke:#d97706; stroke-width:1.5; }
      .shell { fill:#fafafa; stroke:#9aa3b2; stroke-width:1.2; }
      .strip { fill:#fdf3f2; stroke:#c0392b; stroke-width:1.4; }
      .container { fill:none; stroke:#b9c2d0; stroke-width:1.2; stroke-dasharray:6 4; }
      .note { font-size:13.5px; fill:#444; }
      .arrowline { stroke:#8a94a6; stroke-width:1.5; fill:none; }
      .dashline { stroke:#d97706; stroke-width:1.5; fill:none; stroke-dasharray:6 4; }
      .callout { font-size:12px; fill:#8a5a00; font-style:italic; }
      .big-title { font-size:26px; font-weight:800; }
      .sub-title { font-size:14.5px; fill:#667; }
      .strip-title { font-size:14px; font-weight:700; fill:#a93226; }
      .strip-line { font-size:11.5px; fill:#444; }
    </style>
  </defs>

  <!-- ================= header ================= -->
  <text x="40" y="42" class="big-title">Oh-DSH 侧边栏体系 vs 上游 DSH-better-sidebar —— 架构对比（2026-08 调研）</text>
  <text x="40" y="68" class="sub-title">上游基线 v0.10.2（3d88752）→ v0.12.2 / main（78 个提交）｜ 我们 client ~31K LOC vs 上游 ~15K LOC ｜ 左列 = 上游，右列 = 我们</text>

  <!-- ================= column headers ================= -->
  <rect x="40" y="92" width="780" height="56" rx="10" class="up"/>
  <text x="60" y="118" class="col-title" fill="#2c4bd8">上游 DSH-better-sidebar v0.12.2（main 含 v0.13 未发布）</text>
  <text x="60" y="138" class="col-sub">服务化侧边栏框架 · 面向第三方插件生态 · 双工作台（右栏 + 底部）</text>

  <rect x="900" y="92" width="780" height="56" rx="10" class="our"/>
  <text x="920" y="118" class="col-title" fill="#1e7a4a">我们 oh-dsh-desktop v0.1.2 · plugins/sidebar 体系</text>
  <text x="920" y="138" class="col-sub">插件族 · 双发行（Electron 桌面 + DSH Web）· 三面体系 · 中间工作区</text>

  <!-- ================= annotation strip ================= -->
  <rect x="40" y="160" width="1640" height="42" rx="9" class="shell"/>
  <text x="60" y="186" class="note"><tspan font-weight="700">host 侧漂移小：</tspan>仅 8 / 13 个文件有差异（可升级合并）　　<tspan font-weight="700">client 侧彻底分叉：</tspan>UI 模型与内置集合完全不同（不可合并，只可迁移「概念」）　　<tspan font-weight="700">共同点：</tspan>注册表 + 开放 enable map + openPath / 外链拦截 + 每 session 布局持久化</text>

  <!-- ================================================================ -->
  <!-- ================= LEFT COLUMN : upstream ======================== -->
  <!-- ================================================================ -->

  <!-- host half -->
  <rect x="40" y="224" width="780" height="110" rx="10" class="up"/>
  <text x="60" y="250" class="box-title" fill="#2c4bd8">Host 半（Node）— /sidebar/api 服务端</text>
  <text x="60" y="274" class="box-line">fs.read/tree/write · git.status/diff/log/commit · settings · pty（node-pty 回放）</text>
  <text x="60" y="296" class="box-line">jobs（输出回放 / 终止）· trust-fence（webRuntime.trustedHosts）· bundle 懒加载路由 · html 预览</text>
  <text x="60" y="318" class="box-line2">browser.probe · agent-pty 工具注入（terminal_*）· 上游小演进：login shell、信任栅栏 webRuntime</text>
  <line x1="400" y1="334" x2="400" y2="366" class="arrowline" marker-end="url(#arrow)"/>

  <!-- client container -->
  <rect x="40" y="370" width="780" height="470" rx="10" class="container"/>
  <text x="60" y="396" class="box-title" fill="#2c4bd8">Client 半（浏览器）— 公共 API 中心</text>

  <!-- service (highlight) -->
  <rect x="62" y="410" width="736" height="96" rx="9" class="hl"/>
  <text x="78" y="432" class="box-title" fill="#a85d00">ctx.betterSidebar 服务 —— 注册表 + 完整契约（核心概念）</text>
  <text x="78" y="452" class="box-line">registerTab / registerFileViewer（disposer，HMR-safe）· openTab(seed, scope?) 定向打开</text>
  <text x="78" y="472" class="box-line">closeTab / updateTab / activateTab / openFile · matchFileViewer · getSnapshot / subscribeState</text>
  <text x="78" y="492" class="box-line2">version + features[9] 能力探测 · badge · onOpen / onActivate / onClose · meta 跨刷新持久化</text>

  <!-- builtins -->
  <rect x="62" y="518" width="736" height="54" rx="9" class="up"/>
  <text x="78" y="540" class="box-title" fill="#2c4bd8">内置 7 tab（editor / explorer / git / subagent / terminal / browser / diff）+ 6 viewer</text>
  <text x="78" y="560" class="box-line2">与第三方插件走同一注册 API ——「吃狗粮」，能力完全对等</text>

  <!-- store / workbench -->
  <rect x="62" y="584" width="736" height="54" rx="9" class="up"/>
  <text x="78" y="606" class="box-title" fill="#2c4bd8">state.ts store —— splits / bottomSplits 双工作台 reducer</text>
  <text x="78" y="626" class="box-line2">右侧栏 + 底部面板 · 拖 tab 跨面板拆分 / 合并 · 窄视口合并为全宽抽屉</text>

  <!-- declarative settings -->
  <rect x="62" y="650" width="736" height="54" rx="9" class="up"/>
  <text x="78" y="672" class="box-title" fill="#2c4bd8">SideCardSection 声明式设置 seam</text>
  <text x="78" y="692" class="box-line2">注册表驱动开关卡片 + 齿轮弹窗（switch / text / number）· pluginSettings 开放 map（第三方免宿主 schema）</text>

  <!-- orphaned / catalog / intercept -->
  <rect x="62" y="716" width="736" height="54" rx="9" class="up"/>
  <text x="78" y="738" class="box-title" fill="#2c4bd8">OrphanedTab（未注册类型占位）· 推荐插件目录（添加插件弹窗）· 懒加载 chunk</text>
  <text x="78" y="758" class="box-line2">拦截：openPath + 外链 urlTarget 认领（插件可声明「这个域名归我」，browser 隐式兜底）</text>

  <!-- type merging -->
  <rect x="62" y="782" width="736" height="46" rx="9" class="up"/>
  <text x="78" y="804" class="box-line"><tspan class="mono" font-weight="700">declare module 'cordis'</tspan> 类型合并 → <tspan class="mono">ctx.betterSidebar</tspan> · ./client/service 类型子路径（零 Node 依赖）</text>

  <!-- external consumers -->
  <rect x="40" y="874" width="780" height="62" rx="10" class="shell"/>
  <text x="60" y="896" class="box-title">生态消费插件（真实第三方，v0.12 起出现）</text>
  <text x="60" y="918" class="box-line2">dsh-sentinel · dsh-sidebar-qa · Office 预览插件（已移出内置）—— 全部 inject ['betterSidebar']</text>
  <line x1="50" y1="874" x2="50" y2="508" class="arrowline" marker-end="url(#arrow)"/>
  <text x="58" y="700" class="callout" transform="rotate(-90 58 700)">inject ['betterSidebar'] → registerTab / registerFileViewer</text>

  <!-- engineering discipline -->
  <rect x="40" y="964" width="780" height="46" rx="9" class="shell"/>
  <text x="60" y="986" class="box-line2">工程纪律：CI 挂载冒烟门禁（真实 DSH 无头渲染）· client 纯度门 · consumer 类型检查 · AGENTS.md 接入文档</text>

  <!-- ================================================================ -->
  <!-- ================= RIGHT COLUMN : ours =========================== -->
  <!-- ================================================================ -->

  <!-- electron shell -->
  <rect x="900" y="224" width="780" height="46" rx="9" class="shell"/>
  <text x="920" y="248" class="box-line">Electron 壳 + 固定 DSH runtime（pin 0.1.0-rc.7）· cordis.patch.yml 挂载 8 个插件</text>
  <line x1="1290" y1="270" x2="1290" y2="288" class="arrowline" marker-end="url(#arrow)"/>

  <!-- vendored host -->
  <rect x="900" y="290" width="780" height="74" rx="9" class="our"/>
  <text x="920" y="312" class="box-title" fill="#1e7a4a">sidebar-host —— vendor 上游 v0.10.2（基线 3d88752）+ 本地扩展</text>
  <text x="920" y="334" class="box-line2">/sidebar/api：git.status V2+numstat · fs.search（git grep）· blob base64 内联预览</text>
  <text x="920" y="356" class="box-line2">worktree-list/add · bulk paths · 信任栅栏（connection 行）· 与上游 host 的本地差异</text>
  <line x1="1290" y1="364" x2="1290" y2="370" class="arrowline" marker-end="url(#arrow)"/>

  <!-- client container -->
  <rect x="900" y="372" width="780" height="496" rx="10" class="container"/>
  <text x="920" y="396" class="box-title" fill="#1e7a4a">Client 半（浏览器）— 内部注册表 + 三面工作区</text>

  <!-- internal registry service -->
  <rect x="922" y="412" width="736" height="88" rx="9" class="hl"/>
  <text x="938" y="434" class="box-title" fill="#a85d00">DesktopSidebarService 注册表 —— 内部服务，未契约化（差距所在）</text>
  <text x="938" y="452" class="box-line">registerTab / registerViewer（disposer）· openTab / closeTab / activateTab / patchTab</text>
  <text x="938" y="472" class="box-line">dedupeKey / single / createTab / action / chrome / requiresWorkspace</text>
  <text x="938" y="492" class="box-line2">matchViewer · tabsEnabled / viewersEnabled · 每 session 布局持久化 · 无 features / badge / meta</text>

  <!-- right panel -->
  <rect x="922" y="512" width="736" height="54" rx="9" class="our"/>
  <text x="938" y="534" class="box-title" fill="#1e7a4a">SideToolsPanel —— 右栏工具面板（内置 5 tab，与上游集合完全不同）</text>
  <text x="938" y="554" class="box-line2">review · files · side-chat · trajectory · terminal（action 型）· 折叠 / 宽度 / 最大化</text>

  <!-- center surfaces (our unique) -->
  <rect x="922" y="578" width="736" height="74" rx="9" class="hl"/>
  <text x="938" y="600" class="box-title" fill="#a85d00">center-surface-host —— 中间工作区（我们的独有产品决策）</text>
  <text x="938" y="620" class="box-line">file / diff / commit / committed / conflict / browser 等 10 种 surface</text>
  <text x="938" y="640" class="box-line2">三面体系（conversation / file / diff，双发行共用）· Synara 移植</text>

  <!-- review panel -->
  <rect x="922" y="664" width="736" height="54" rx="9" class="our"/>
  <text x="938" y="686" class="box-title" fill="#1e7a4a">workspace-panel —— Git Review + 逐行评论</text>
  <text x="938" y="706" class="box-line2">changes / history · 行评论 → composer 汇总 · committed / unpushed diff（独有视图）</text>

  <!-- diff suite + viewers -->
  <rect x="922" y="730" width="736" height="54" rx="9" class="our"/>
  <text x="938" y="752" class="box-title" fill="#1e7a4a">diff 套件（@pierre/diffs worker）+ files 查看器族</text>
  <text x="938" y="772" class="box-line2">unified / split · 图片 diff · 冲突解决 · markdown / ipynb / mermaid 查看 · 懒加载</text>

  <!-- settings + intercept -->
  <rect x="922" y="796" width="736" height="54" rx="9" class="our"/>
  <text x="938" y="818" class="box-title" fill="#1e7a4a">设置区（settings.section，固定清单）+ runtime settings</text>
  <text x="938" y="838" class="box-line2">拦截：openPath registry + 外链（仅 browser 兜底）· 无 urlTarget 认领 · 插件无法声明设置</text>

  <!-- desktop add-on -->
  <rect x="900" y="892" width="780" height="62" rx="9" class="shell"/>
  <text x="920" y="914" class="box-title">sidebar-desktop —— 桌面增强层（desktopSidebar 服务「唯一消费者」）</text>
  <text x="920" y="936" class="box-line2">webview 浏览器 tab + browser surface renderer · 消费 desktopSidebar 服务</text>
  <line x1="912" y1="892" x2="912" y2="502" class="dashline" marker-end="url(#arrowDash)"/>
  <text x="920" y="972" class="callout">ctx.reflect.provide('desktopSidebar') —— 无类型合并 / 无文档 / 无 features</text>

  <!-- shared -->
  <rect x="900" y="982" width="780" height="46" rx="9" class="shell"/>
  <text x="920" y="1004" class="box-line2">shared：git-core / fs-tree / wire / sidebar-api / path / surface-tab —— 插件族内源码共享能力层</text>

  <!-- other plugins -->
  <rect x="900" y="1050" width="780" height="46" rx="9" class="shell"/>
  <text x="920" y="1072" class="box-line2">其余插件：panel-controls · pinned-summary · desktop-skins · plugin-marketplace · desktop-left-rail</text>

  <!-- ================================================================ -->
  <!-- ================= BOTTOM STRIP : biggest differences ============ -->
  <!-- ================================================================ -->
  <text x="40" y="1130" class="big-title" font-size="20">🔴 最大的四处分叉（迁移评估结论：概念可迁，代码不可合）</text>

  <rect x="40" y="1146" width="395" height="190" rx="10" class="strip"/>
  <text x="56" y="1172" class="strip-title">① 服务契约层 —— 最大差异（建议迁移）</text>
  <text x="56" y="1196" class="strip-line">上游：注册表 = 公共 API —— 类型合并、features /</text>
  <text x="56" y="1216" class="strip-line">version 能力探测、接入文档、真实第三方消费者</text>
  <text x="56" y="1236" class="strip-line">（dsh-sentinel 等），内置与外部完全对等。</text>
  <text x="56" y="1260" class="strip-line">我们：注册表 = 内部机制 —— 唯一消费者是自己家</text>
  <text x="56" y="1280" class="strip-line">的 sidebar-desktop，无契约、无文档、无能力探测。</text>
  <text x="56" y="1312" class="strip-line" font-weight="700" fill="#a93226">迁移成本：中等（纯增量）→ 补 features / 类型合并 / 文档。</text>

  <rect x="455" y="1146" width="395" height="190" rx="10" class="strip"/>
  <text x="471" y="1172" class="strip-title">② 内容落点模型 —— 产品决策分叉（不迁移）</text>
  <text x="471" y="1196" class="strip-line">上游：右侧栏 + 底部面板双工作台，tab 拖拽跨面板</text>
  <text x="471" y="1216" class="strip-line">拆分 / 合并。</text>
  <text x="471" y="1240" class="strip-line">我们：中间工作区 center surfaces（file / diff 开在</text>
  <text x="471" y="1260" class="strip-line">对话上方）+ 右栏工具 + 底部 PTY dock，双发行</text>
  <text x="471" y="1280" class="strip-line">共用三面体系。</text>
  <text x="471" y="1312" class="strip-line" font-weight="700" fill="#a93226">结论：不可合并，也不该合并；学概念时保留落点模型。</text>

  <rect x="870" y="1146" width="395" height="190" rx="10" class="strip"/>
  <text x="886" y="1172" class="strip-title">③ 设置可扩展性 —— 建议迁移</text>
  <text x="886" y="1196" class="strip-line">上游：声明式设置 seam —— 注册表驱动开关卡片 +</text>
  <text x="886" y="1216" class="strip-line">pluginSettings 开放 map，第三方自带设置行 / 自定义</text>
  <text x="886" y="1236" class="strip-line">面板，免宿主 schema。</text>
  <text x="886" y="1260" class="strip-line">我们：设置区固定清单，插件无法声明自己的设置</text>
  <text x="886" y="1280" class="strip-line">（settings.tsx 只列开关）。</text>
  <text x="886" y="1312" class="strip-line" font-weight="700" fill="#a93226">迁移成本：低-中（pluginToggles / render seam + 开放 map）。</text>

  <rect x="1285" y="1146" width="395" height="190" rx="10" class="strip"/>
  <text x="1301" y="1172" class="strip-title">④ 内置集合与生态 —— 各走各路</text>
  <text x="1301" y="1196" class="strip-line">上游：通用工作台 7 tab（subagent 拓扑 / 浏览器 /</text>
  <text x="1301" y="1216" class="strip-line">编辑器）+ Office 移出内置 + 推荐插件目录 + CI 挂载</text>
  <text x="1301" y="1236" class="strip-line">冒烟门禁。</text>
  <text x="1301" y="1260" class="strip-line">我们：Review / Desktop 导向 5 tab（行评论 / committed</text>
  <text x="1301" y="1280" class="strip-line">diff / 市场 / 皮肤 / webview）；host 仅 8 文件漂移。</text>
  <text x="1301" y="1312" class="strip-line" font-weight="700" fill="#a93226">结论：集合完全不重叠；工程纪律互相借鉴。</text>
</svg>
