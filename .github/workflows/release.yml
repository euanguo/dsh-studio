name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            id: macos-arm64
            os: macos-15
            dist_script: dist:mac
            node_platform: darwin
            node_arch: arm64
            update_platform: mac-arm64
          - name: macOS x64
            id: macos-x64
            os: macos-15-intel
            dist_script: dist:mac:x64
            node_platform: darwin
            node_arch: x64
            update_platform: mac-x64
          - name: Linux x64
            id: linux-x64
            os: ubuntu-24.04
            dist_script: dist:linux
            node_platform: linux
            node_arch: x64
            update_platform: linux-x64
          - name: Windows x64
            id: windows-x64
            os: windows-2025
            dist_script: dist:win
            node_platform: win
            node_arch: x64
            update_platform: win-x64
    env:
      DSH_STUDIO_NODE_ARCH: ${{ matrix.node_arch }}
      DSH_STUDIO_NODE_PLATFORM: ${{ matrix.node_platform }}
      npm_config_pm_on_fail: 'ignore'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          architecture: ${{ matrix.node_arch }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select macOS signing mode
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          MACOS_APPLE_ID: ${{ secrets.APPLE_ID }}
          MACOS_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MACOS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if test -n "$MACOS_CSC_LINK" && test -n "$MACOS_CSC_KEY_PASSWORD" && test -n "$MACOS_APPLE_ID" && test -n "$MACOS_APPLE_APP_SPECIFIC_PASSWORD" && test -n "$MACOS_APPLE_TEAM_ID"; then
            echo 'DSH_STUDIO_SIGNING=enabled' >> "$GITHUB_ENV"
            echo "macOS signing and notarization are enabled." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'DSH_STUDIO_SIGNING=fallback' >> "$GITHUB_ENV"
            echo "::warning::macOS signing credentials are incomplete; producing an ad-hoc-signed package that requires manual Gatekeeper approval."
            echo "macOS signing: ad-hoc fallback; automatic updates are unsupported." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Select Windows signing mode
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if test -n "$WINDOWS_CSC_LINK" && test -n "$WINDOWS_CSC_KEY_PASSWORD"; then
            echo 'DSH_STUDIO_SIGNING=enabled' >> "$GITHUB_ENV"
            echo "Windows Authenticode signing is enabled." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'DSH_STUDIO_SIGNING=fallback' >> "$GITHUB_ENV"
            echo "::warning::Windows signing credentials are incomplete; producing an unsigned installer that may require manual SmartScreen approval."
            echo "Windows signing: unsigned fallback; automatic updates are unsupported." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Package signed macOS desktop distribution
        if: runner.os == 'macOS' && env.DSH_STUDIO_SIGNING == 'enabled'
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm run ${{ matrix.dist_script }}

      - name: Package signed Windows desktop distribution
        if: runner.os == 'Windows' && env.DSH_STUDIO_SIGNING == 'enabled'
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: pnpm run ${{ matrix.dist_script }}

      - name: Package desktop distribution without release credentials
        if: env.DSH_STUDIO_SIGNING != 'enabled'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm run ${{ matrix.dist_script }}

      - name: Package DSH Studio-Web distribution
        run: node scripts/build-web.mjs

      - name: Verify updater metadata
        shell: bash
        run: node scripts/verify-update-metadata.mjs --dir release --version "$(node -p "require('./package.json').version")" --platform "${{ matrix.update_platform }}"

      - name: Separate updater metadata by platform
        run: node scripts/collect-update-metadata.mjs --dir release --id ${{ matrix.id }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.id }}
          compression-level: 0
          path: |
            release/DSH-Studio-*
            release/dsh-studio-web-*.tar.gz
            release/dsh-studio-web-*.zip
            release/updater-metadata/**
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate stable release tag
        run: node scripts/validate-release-tag.mjs --tag "$GITHUB_REF_NAME" --version "$(node -p "require('./package.json').version")"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare and validate updater metadata
        run: node scripts/prepare-release-update-metadata.mjs --dir artifacts --version "$(node -p "require('./package.json').version")"

      - name: Verify release asset set before publishing
        run: |
          find artifacts -maxdepth 1 -type f -print | sed 's#^.*/##' | sort > local-assets.txt
          test -s local-assets.txt
          grep -qx 'latest.yml' local-assets.txt
          grep -qx 'latest-linux.yml' local-assets.txt
          grep -qx 'latest-mac.yml' local-assets.txt

      - name: Publish release
        run: node scripts/publish-github-release.mjs --dir artifacts --tag "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify published release asset set
        run: |
          find artifacts -maxdepth 1 -type f -print | sed 's#^.*/##' | sort > local-assets.txt
          gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name' | sort > remote-assets.txt
          diff -u local-assets.txt remote-assets.txt
        env:
          GH_TOKEN: ${{ github.token }}
