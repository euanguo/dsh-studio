# Oh-DSH-Desktop is a bundle layer over dsh-base + dsh-web-app. The Electron
# distribution keeps DSH's browser UI and mounts each desktop behavior as an
# independently registered Host/Client plugin.

- id: webserver
  config:
    host: 127.0.0.1
    port: 0

- id: web-runtime
  config:
    printUrl: true
    surfaceContext: false
    trustedHosts: []

- insert:
    - id: oh-desktop
      name: '@oh-dsh/desktop'

    - id: oh-better-sidebar-runtime
      name: '@oh-dsh/better-sidebar-runtime'

    - id: oh-vision
      name: '@oh-dsh/vision'

    - id: oh-skins
      name: '@oh-dsh/skins'

    - id: oh-sidebar
      name: '@oh-dsh/sidebar'

    - id: oh-panel-controls
      name: '@oh-dsh/panel-controls'

    - id: oh-pinned-summary
      name: '@oh-dsh/pinned-summary'

    - id: oh-plugin-marketplace
      name: '@oh-dsh/plugin-marketplace'

# Left rail: the forked ui-workspace replaces the official browser. The
# official row is disabled (slot 'sidebar.workspaces' is single-owner), and
# the fork registers into the same hole with the project→worktree→session
# tree.
- id: ui-workspace
  disabled: true

- insert:
    - id: oh-desktop-left-rail
      name: '@oh-dsh/desktop-left-rail'
