# DSH Studio is a bundle layer over dsh-base + dsh-web-app. The Electron
# distribution keeps DSH's browser UI and mounts each desktop behavior as an
# independently registered Host/Client plugin.

- id: webserver
  config:
    host: 127.0.0.1
    port: 0

- id: web-runtime
  config:
    openBrowser: false
    printUrl: true
    surfaceContext: false
    trustedHosts: []

- insert:
    - id: oh-desktop
      name: '@dsh-studio/desktop'

    - id: oh-capabilities
      name: '@dsh-studio/capabilities'

    - id: oh-desktop-skins
      name: '@dsh-studio/desktop-skins'

    - id: oh-sidebar
      name: '@dsh-studio/sidebar'

    - id: oh-panel-controls
      name: '@dsh-studio/panel-controls'

    - id: oh-pinned-summary
      name: '@dsh-studio/pinned-summary'

    - id: oh-plugin-marketplace
      name: '@dsh-studio/plugin-marketplace'

    - id: oh-sidebar-desktop
      name: '@dsh-studio/sidebar-desktop'

# Left rail: the forked ui-workspace replaces the official browser. The
# official row is disabled (slot 'sidebar.workspaces' is single-owner), and
# the fork registers into the same hole with the project→worktree→session
# tree.
- id: ui-workspace
  disabled: true

- insert:
    - id: oh-desktop-left-rail
      name: '@dsh-studio/desktop-left-rail'
