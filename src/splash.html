<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oh-DSH-Desktop</title>
    <style>
      :root { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; color-scheme: light dark; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(160deg, #69A8FF 0%, #3478F0 52%, #1E4AC7 100%); color: #fff; }
      main { width: min(520px, calc(100vw - 48px)); text-align: center; }
      .mark { width: 68px; height: 68px; margin: 0 auto 22px; border-radius: 20px; box-shadow: 0 16px 38px rgb(18 57 143 / 36%); } .mark svg { display: block; width: 100%; height: 100%; }
      h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
      p { margin: 10px auto 0; max-width: 440px; color: rgb(255 255 255 / 82%); font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
      .spinner { width: 22px; height: 22px; margin: 26px auto 0; border: 2px solid rgb(255 255 255 / 28%); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
      .error .spinner { display: none; }
      .error .mark { filter: saturate(0.35) brightness(0.92); }
      .detail { margin-top: 18px; padding: 12px 14px; border-radius: 10px; background: rgb(0 0 0 / 18%); color: rgb(255 255 255 / 78%); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; text-align: left; overflow-wrap: anywhere; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="160" y1="80" x2="864" y2="944" gradientUnits="userSpaceOnUse">
      <stop stop-color="#69A8FF"/>
      <stop offset="0.52" stop-color="#3478F0"/>
      <stop offset="1" stop-color="#1E4AC7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#12398F" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#background)"/>
  <path d="M226 544c70-114 177-178 304-178 65 0 128 17 184 49 28-17 55-46 75-85 17 57 9 108-24 152 8 27 12 56 12 86 0 145-120 251-286 251-140 0-250-74-287-187 55 49 126 73 213 73 99 0 171-28 217-84-55 27-117 39-185 36-103-5-181-43-233-113z" fill="#fff" filter="url(#shadow)"/>
  <path d="M297 482c50-95 133-143 249-143-40 22-72 55-97 98-60 2-110 17-152 45z" fill="#DCEAFF"/>
  <circle cx="646" cy="487" r="17" fill="#2557D6"/>
  <path d="M747 495c45-7 78-28 100-62-3 59-32 97-86 114z" fill="#fff"/>
</svg>
    </div>
      <h1>Oh-DSH-Desktop</h1>
      <p id="message">正在启动 DeepSeek Harness…</p>
      <div class="spinner" aria-label="正在启动"></div>
      <div class="detail" id="detail" hidden></div>
    </main>
    <script>
      const params = new URLSearchParams(location.search)
      const state = params.get('state')
      const message = params.get('message')
      const detail = params.get('detail')
      if (state === 'error') document.body.classList.add('error')
      if (message) document.querySelector('#message').textContent = message
      if (detail) {
        const node = document.querySelector('#detail')
        node.textContent = detail
        node.hidden = false
      }
    </script>
  </body>
</html>
